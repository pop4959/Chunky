name: Build Chunky
on: [ push, pull_request ]
jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Upload Bukkit
        uses: actions/upload-artifact@v7
        with:
          path: "bukkit/build/libs/Chunky-*.jar"
          archive: false
      - name: Upload Paper
        uses: actions/upload-artifact@v7
        with:
          path: "paper/build/libs/Chunky-*.jar"
          archive: false
      - name: Upload Fabric
        uses: actions/upload-artifact@v7
        with:
          path: "fabric/build/libs/Chunky-*.jar"
          archive: false
      - name: Upload Forge
        uses: actions/upload-artifact@v7
        with:
          path: "forge/build/libs/Chunky-*.jar"
          archive: false
      - name: Upload NeoForge
        uses: actions/upload-artifact@v7
        with:
          path: "neoforge/build/libs/Chunky-*.jar"
          archive: false
      - name: Upload Sponge
        uses: actions/upload-artifact@v7
        with:
          path: "sponge/build/libs/Chunky-*.jar"
          archive: false
